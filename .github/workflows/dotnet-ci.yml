name: FreeCleaner .NET 10 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FreeCleaner.slnx

      - name: Build solution
        run: dotnet build FreeCleaner.slnx --configuration Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Run unit tests with code coverage
        run: dotnet test FreeCleaner.Tests/FreeCleaner.Tests.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory TestResults --logger "trx;LogFileName=test-results.trx"

      - name: Publish Test & Coverage Summary
        if: always()
        shell: pwsh
        run: |
          $minLineCoverage = 36.0
          $cov = Get-ChildItem -Path TestResults -Recurse -Filter "coverage.cobertura.xml" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cov) {
            [xml]$x = Get-Content $cov.FullName
            $lr = [math]::Round([double]$x.coverage.'line-rate' * 100, 2)
            $br = [math]::Round([double]$x.coverage.'branch-rate' * 100, 2)
            $lc = $x.coverage.'lines-covered'
            $lv = $x.coverage.'lines-valid'
            $bc = $x.coverage.'branches-covered'
            $bv = $x.coverage.'branches-valid'
            $floorPass = $lr -ge $minLineCoverage
            $floorBadge = if ($floorPass) { "PASS (>= $minLineCoverage%)" } else { "FAIL (< $minLineCoverage%)" }
            if ($env:GITHUB_STEP_SUMMARY) {
              @"
          ## FreeCleaner CI Coverage Summary
          | Metric | Coverage | Covered / Total |
          | :--- | :---: | :---: |
          | Line Coverage | **$lr%** | $lc / $lv |
          | Branch Coverage | **$br%** | $bc / $bv |
          | Minimum Line Coverage Floor | **$floorBadge** | Threshold: $minLineCoverage% |
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8
            }
            if (-not $floorPass) {
              Write-Error "Line coverage $lr% fell below the required CI floor ($minLineCoverage%)."
              exit 1
            }
          }

      - name: Upload test & coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-and-coverage
          path: TestResults/
          retention-days: 14
