name: Release Portable Single-File (.NET 10)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FreeCleaner.slnx

      - name: Run unit tests
        run: dotnet test FreeCleaner.Tests/FreeCleaner.Tests.csproj --configuration Release

      - name: Publish Single-File Portable Executable (win-x64)
        run: |
          dotnet publish FreeCleaner/FreeCleaner.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            --output release_out

      - name: Package Portable Zip Archive
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "v4.0.0" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zipPath = "dist/FreeCleaner-Portable-win-x64-$tag.zip"
          Compress-Archive -Path "release_out/FreeCleaner.exe" -DestinationPath $zipPath -Force
          Write-Host "Packaged portable archive: $zipPath"

      - name: Upload Artifacts & Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/FreeCleaner-Portable-win-x64-*.zip
            release_out/FreeCleaner.exe
