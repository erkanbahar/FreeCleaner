name: Release Portable Single-File (.NET 10)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-publish-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FreeCleaner.slnx

      - name: Build solution (warnings as errors)
        run: dotnet build FreeCleaner.slnx --configuration Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Run unit tests
        run: dotnet test FreeCleaner.Tests/FreeCleaner.Tests.csproj --configuration Release --no-build

      - name: Publish Single-File Portable Executable (win-x64)
        run: |
          dotnet publish FreeCleaner/FreeCleaner.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:TreatWarningsAsErrors=true `
            --output release_out

      - name: Publish Single-File Portable Executable (win-arm64)
        run: |
          dotnet publish FreeCleaner/FreeCleaner.csproj `
            --configuration Release `
            --runtime win-arm64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:TreatWarningsAsErrors=true `
            --output release_arm64

      - name: Package Portable Archives & Windows Setup Installer
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "v5.0.0" }
          $ver = $tag.TrimStart('v', 'V')
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path release_usb | Out-Null

          $zipPath = "dist/FreeCleaner-Portable-win-x64-$tag.zip"
          Compress-Archive -Path "release_out/FreeCleaner.exe" -DestinationPath $zipPath -Force

          $arm64ZipPath = "dist/FreeCleaner-Portable-win-arm64-$tag.zip"
          Compress-Archive -Path "release_arm64/FreeCleaner.exe" -DestinationPath $arm64ZipPath -Force

          Copy-Item -Path "release_out/FreeCleaner.exe" -Destination "release_usb/FreeCleaner.exe" -Force
          "FreeCleaner Pro Portable Mode enabled" | Set-Content -Path "release_usb/portable.flag" -Encoding UTF8
          $usbZipPath = "dist/FreeCleaner-Portable-USB-win-x64-$tag.zip"
          Compress-Archive -Path "release_usb/FreeCleaner.exe","release_usb/portable.flag" -DestinationPath $usbZipPath -Force

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          $setupOut = "dist/FreeCleaner-Setup-win-x64-$tag.exe"
          if (Test-Path $iscc) {
            & $iscc "/DMyAppVersion=$ver" "/DSourceExe=..\release_out\FreeCleaner.exe" "/DOutputDirPath=..\dist" "/O..\dist" "installer\FreeCleaner.iss"
            $builtSetup = Get-ChildItem "dist/FreeCleaner-Setup-win-x64-*.exe" | Select-Object -First 1
            if ($builtSetup -and $builtSetup.FullName -ne (Join-Path (Resolve-Path "dist").Path (Split-Path -Leaf $setupOut))) {
              Move-Item -Path $builtSetup.FullName -Destination $setupOut -Force
            }
          }

          $exeHash = (Get-FileHash -Path "release_out/FreeCleaner.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $arm64ZipHash = (Get-FileHash -Path $arm64ZipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $usbZipHash = (Get-FileHash -Path $usbZipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipName = [System.IO.Path]::GetFileName($zipPath)
          $arm64ZipName = [System.IO.Path]::GetFileName($arm64ZipPath)
          $usbZipName = [System.IO.Path]::GetFileName($usbZipPath)
          $sums = @("$exeHash  FreeCleaner.exe", "$zipHash  $zipName", "$arm64ZipHash  $arm64ZipName", "$usbZipHash  $usbZipName")
          if (Test-Path $setupOut) {
            $setupHash = (Get-FileHash -Path $setupOut -Algorithm SHA256).Hash.ToLowerInvariant()
            $setupName = [System.IO.Path]::GetFileName($setupOut)
            $sums += "$setupHash  $setupName"
          }
          $sums | Set-Content -Path "dist/SHA256SUMS.txt" -Encoding UTF8

          $wingetStage = "dist/winget"
          New-Item -ItemType Directory -Force -Path $wingetStage | Out-Null
          $exeHashUpper = $exeHash.ToUpperInvariant()
          foreach ($manifest in Get-ChildItem "installer/winget/*.yaml") {
            $content = (Get-Content -Path $manifest.FullName -Raw -Encoding UTF8) `
              -replace 'REPLACE_WITH_RELEASE_SHA256', $exeHashUpper `
              -replace '4\.8\.0', $ver `
              -replace 'v4\.8\.0', $tag
            Set-Content -Path (Join-Path $wingetStage $manifest.Name) -Value $content -Encoding UTF8 -NoNewline
          }
          $wingetZipPath = "dist/FreeCleaner-Winget-Manifests-$tag.zip"
          Compress-Archive -Path "$wingetStage/*.yaml" -DestinationPath $wingetZipPath -Force
          Write-Host "Packaged portable archives (win-x64 & win-arm64), setup installer, Winget manifests & SHA256SUMS"

      - name: Attest Build Provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release_out/FreeCleaner.exe
            dist/FreeCleaner-Portable-win-x64-*.zip
            dist/FreeCleaner-Portable-win-arm64-*.zip
            dist/FreeCleaner-Portable-USB-win-x64-*.zip
            dist/FreeCleaner-Setup-win-x64-*.exe
            dist/SHA256SUMS.txt

      - name: Upload Artifacts & Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/FreeCleaner-Portable-win-x64-*.zip
            dist/FreeCleaner-Portable-win-arm64-*.zip
            dist/FreeCleaner-Portable-USB-win-x64-*.zip
            dist/FreeCleaner-Setup-win-x64-*.exe
            dist/FreeCleaner-Winget-Manifests-*.zip
            dist/SHA256SUMS.txt
            release_out/FreeCleaner.exe
